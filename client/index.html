<!doctype html>
<!-- 한국어 페이지 — lang 이 en 이면 크롬·엣지가 "영어 페이지"로 보고 자동 번역을 걸어 한글이 엉뚱하게 바뀌고
     (React 화면이 번역기와 부딪혀 깨지기도 한다). 한국어로 밝히고 번역 자체를 끈다. -->
<html lang="ko" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <!-- 탭 아이콘. 브라우저는 아이콘을 주소별로 따로 오래 저장해 두어 같은 주소면 바꿔도 옛 그림(번개)을 계속 쓴다 —
         그림을 바꿀 때는 파일 이름을 바꾼다. favicon.svg 는 주소를 직접 여는 경우를 위해 같은 그림으로 둔다. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-otter.svg" />
    <!-- favicon.ico: 윈도 바탕화면·작업표시줄 바로가기가 쓰는 아이콘(16~256px 수달). SVG 를 못 쓰는 곳의 대비용 -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 256x256" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#335BFF" />
    <!-- 홈 화면에 추가 시 브라우저 주소창 없이 전체화면 앱처럼 실행 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default: 아이폰 시계·배터리 줄을 흰 바탕·검은 글씨로 따로 둔다. black-translucent 는 화면이 그 줄 밑까지
         올라가 흰 글씨 시계가 밝은 상단바와 겹쳐 안 보였다. 바꾼 뒤에는 홈 화면 아이콘을 지우고 다시 추가해야 반영된다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="세정통합웹" />
    <title>세정통합웹</title>
  </head>
  <body class="notranslate" translate="no">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
