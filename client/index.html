<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 탭 아이콘. 브라우저는 아이콘을 주소별로 따로 오래 저장해 두어 같은 주소면 바꿔도 옛 그림(번개)을 계속 쓴다 —
         그림을 바꿀 때는 파일 이름을 바꾼다. favicon.svg 는 주소를 직접 여는 경우를 위해 같은 그림으로 둔다. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-otter.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#335BFF" />
    <!-- 홈 화면에 추가 시 브라우저 주소창 없이 전체화면 앱처럼 실행 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default: 아이폰 시계·배터리 줄을 흰 바탕·검은 글씨로 따로 둔다. black-translucent 는 화면이 그 줄 밑까지
         올라가 흰 글씨 시계가 밝은 상단바와 겹쳐 안 보였다. 바꾼 뒤에는 홈 화면 아이콘을 지우고 다시 추가해야 반영된다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="세정업무" />
    <title>세정팀 업무 통합 관리</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
